name: Persona schedule (Kaggle)
# The laptop-free persona schedule (persona/actions.py). One Kaggle render a day,
# five posting slots into the review channel, votes collected at every run.
# Social lane only -- the Fanvue lane never leaves the laptop. Her data lives in a
# private Kaggle dataset, never in this public repo.
#
# Driven by the Cloudflare Worker (worker/src/persona.js), times UTC:
#   02:30-03:15 render   (retried; exits if today's batch already started)
#   06/09/12/15/18 post  (~09/12/15/18/21 Romania summer time)
#   every 15 min votes   moves the 🎬/🔁 kernel along; each tap or reply is also
#                        forwarded at once as `update`
#
# Secrets: KAGGLE_USERNAME, KAGGLE_API_TOKEN, HF_TOKEN(S), PERSONA_BOT_TOKEN,
# PERSONA_CHAT_ID. Variables: PERSONA_SLUG (empty = schedule off),
# PERSONA_CLOUD_IMAGES, PERSONA_CLOUD_VIDEOS, PERSONA_CLOUD_VOTES.
on:
  # Driven by the Cloudflare Worker (worker/src/persona.js): its cron every 15 min
  # and the persona bot's webhook. GitHub's own schedule for this workflow ran
  # hours late or not at all, so it is no longer used.
  workflow_dispatch:
    inputs:
      action:
        description: "render, post, votes, or qa (dry-run the photo check)"
        default: votes
        type: choice
        options: [render, post, votes, qa]
      slot:
        description: "post slot 0-4 (4 posts everything left)"
        default: "4"
        type: string
      update:
        description: "a Telegram update (JSON) forwarded by the Worker"
        default: ""
        type: string

# models: read gives the free GitHub Models API (scene writing) to GITHUB_TOKEN.
permissions:
  contents: read
  models: read

concurrency:
  group: persona-schedule
  cancel-in-progress: false

env:
  KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
  PERSONA_BOT_TOKEN: ${{ secrets.PERSONA_BOT_TOKEN }}
  PERSONA_CHAT_ID: ${{ secrets.PERSONA_CHAT_ID }}
  GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_TOKENS: ${{ secrets.HF_TOKENS }}
  PERSONA_CLOUD_IMAGES: ${{ vars.PERSONA_CLOUD_IMAGES || '10' }}
  PERSONA_CLOUD_VIDEOS: ${{ vars.PERSONA_CLOUD_VIDEOS || '0' }}
  PERSONA_CLOUD_VOTES: ${{ vars.PERSONA_CLOUD_VOTES || '1' }}
  OLLAMA_TIMEOUT: "600"

jobs:
  run:
    if: vars.PERSONA_SLUG != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install kaggle requests pillow
      # The scene writer's free fallback: a local model on the runner. GitHub Models
      # answers a bare "OK" for this account and HF's free credits run out, so
      # without this the render had no LLM and repeated her bible's few places.
      # Only the daily render needs it.
      - name: Install Ollama (render only)
        if: inputs.action == 'render'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do curl -sf http://localhost:11434/api/tags > /dev/null && break; sleep 1; done
          ollama pull llama3.2:3b
      - name: Render, post or votes
        env:
          PERSONA_UPDATE: ${{ inputs.update }}
        run: |
          ACTION="${{ inputs.action }}"; SLOT="${{ inputs.slot }}"
          if [ "$ACTION" = render ]; then
            python -m persona.actions render "${{ vars.PERSONA_SLUG }}"
          elif [ "$ACTION" = qa ]; then
            python -m persona.actions qa "${{ vars.PERSONA_SLUG }}"
          elif [ "$ACTION" = votes ]; then
            python -m persona.actions votes "${{ vars.PERSONA_SLUG }}"
          else
            python -m persona.actions post "${{ vars.PERSONA_SLUG }}" "$SLOT" 5
          fi
