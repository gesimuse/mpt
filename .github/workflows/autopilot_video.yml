name: MPT Autopilot Video (aibeautyvideo)
# No cron -- the video niche is intentionally manual. Run push_video.py locally,
# pick an image, edit the motion prompt, press Confirm; that fires this
# workflow_dispatch with the chosen inputs. Video generation calls HF ZeroGPU's
# Wan 2.2 I2V rCM Space directly (videogen.py) -- no Kaggle involved: Kaggle
# never did any compute here, it was pure push/poll/download plumbing kept
# "for continuity" with an earlier design, and its kernel API had no way to
# request a specific accelerator, causing real, unfixable-from-here failures.
# The resulting mp4 is posted as a TikTok inbox draft by MPT.
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Source image URL (from gh-pages media/; push_video.py fills this). Leave blank when using retry_video_url."
        required: false
        type: string
      motion_prompt:
        description: "Motion prompt"
        required: false
        type: string
      length_s:
        description: "Video length in seconds (max 5.0)"
        required: false
        default: "5.0"
        type: string
      steps:
        description: "Wan rCM inference steps (4-8)"
        required: false
        default: "8"
        type: string
      retry_video_url:
        description: "Already-generated mp4 URL to republish as-is, skipping the HF Space call entirely (the picker's Retry button on a failed video)"
        required: false
        type: string

concurrency:
  # Same group as autopilot.yml, not a separate "autopilot-video" one -- both
  # workflows write posted.json/CAPTIONS.md, and running under separate groups
  # let them execute concurrently, which lost a full batch of Kaggle-generated
  # images to a rebase-conflict-then-silent-push-failure on a live run (see the
  # "Persist state" step in both workflows). Queuing image and video runs
  # against each other instead of racing is a real fix for that; the retry
  # loop in "Persist state" is the second layer, for any other concurrent
  # writer (the picker's own Contents-API writes, a manual push).
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # Real Wan 2.2 I2V rCM run is ~1-2min of actual generation; 30min ceiling
    # protects the runner if the HF Space queues or stalls.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # gradio_client calls the HF Space directly (videogen.py). requests
        # handles TikTok + git; no torch/mediapipe/ollama needed for the video
        # path -- the actual model inference happens on HF's ZeroGPU, not here.
        run: pip install gradio_client requests

      - name: Install ffmpeg
        # videogen.py shells out to ffmpeg to normalize frame rate before TikTok
        # publish (TikTok rejected a real draft with frame_rate_check_failed on
        # motionforge's raw output) -- confirmed NOT preinstalled on this runner
        # despite it being on GitHub's documented ubuntu-latest software list.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run autopilot (video niche only)
        env:
          NICHES: aibeautyvideo
          # autopilot.py._run_video_niche reads these overrides -- push_video.py's
          # local UI is what put them here via workflow_dispatch inputs.
          VIDEO_IMAGE_URL: ${{ inputs.image_url }}
          VIDEO_PROMPT: ${{ inputs.motion_prompt }}
          VIDEO_LENGTH_S: ${{ inputs.length_s }}
          VIDEO_STEPS: ${{ inputs.steps }}
          VIDEO_RETRY_URL: ${{ inputs.retry_video_url }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional, comma-separated HF_TOKENS secret (multiple accounts) takes
          # priority over the single HF_TOKEN above in videogen.py -- rotates to
          # the next token if one hits its account's free ZeroGPU quota
          # (5min/day each). Only add this secret if you actually have more
          # than one HF account's token; leaving it unset falls back to the
          # single HF_TOKEN unchanged.
          HF_TOKENS: ${{ secrets.HF_TOKENS }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_AIBEAUTY: ${{ secrets.TIKTOK_REFRESH_TOKEN_AIBEAUTY }}
          PAGES_BASE_URL: https://gesimuse.github.io/mpt
        run: python autopilot.py

      # See autopilot.yml's own "Persist state" step for why this retries and
      # fails loudly instead of a one-shot swallow -- this workflow and that one
      # both write posted.json/CAPTIONS.md and used to run in separate
      # concurrency groups, which lost a full batch of images to a silent
      # rebase-conflict swallow on a live run.
      - name: Persist state (keepalive)
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@github.com"
          git add posted.json CAPTIONS.md
          if git diff --cached --quiet; then
            echo "nothing to persist"
            exit 0
          fi
          git commit -m "chore: autopilot-video run $(date -u +%F_%H:%M)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin ${{ github.ref_name }} && git push; then
              echo "persisted on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::failed to persist posted.json/CAPTIONS.md after 5 attempts -- state from this run was NOT saved to main"
          exit 1
