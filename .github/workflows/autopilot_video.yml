name: MPT Autopilot Video (aibeautyvideo)
# No cron -- the video niche is intentionally manual. Open picker.html on GitHub
# Pages, pick an image, edit the motion prompt, press Confirm; that fires this
# workflow_dispatch with the chosen inputs. Video generation walks a ladder of HF
# ZeroGPU Spaces (videogen.py: Wan 2.2 I2V rCM, then Wan 2.1 fast, then LTX-Video
# distilled), rotating HF_TOKENS across accounts on a quota error.
#
# There is no fallback under that. A self-hosted Kaggle T4 path (LTX-Video 0.9.5) was
# built and did work end to end, but its output quality was rejected -- nothing that
# fits a 15 GB T4 came close to Wan 2.2. When every Space and token is spent, the run
# fails and waits for quota rather than shipping something worse.
# The resulting mp4 is posted as a TikTok inbox draft by MPT.
on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "Source image URL (from gh-pages media/; push_video.py fills this). Leave blank when using retry_video_url."
        required: false
        type: string
      motion_prompt:
        description: "Motion prompt"
        required: false
        type: string
      length_s:
        description: "Video length in seconds (max 5.0)"
        required: false
        default: "5.0"
        type: string
      steps:
        description: >-
          Wan rCM inference steps. The Space's slider allows 1-30, but every step
          costs real ZeroGPU quota: it bills 10 + steps * ~15.6s against ~300s per
          HF account per day. 4 -> 72s (4 videos/account/day), 8 -> 135s (2),
          16 -> 260s (1), 30 -> 478s, which exceeds a whole day in one request and
          always fails. 8 is the highest that keeps a workable rate.
        required: false
        default: "8"
        type: string
      retry_video_url:
        description: "Already-generated mp4 URL to republish as-is, skipping the HF Space call entirely (the picker's Retry button on a failed video)"
        required: false
        type: string

concurrency:
  # Same group as autopilot.yml, not a separate "autopilot-video" one -- both
  # workflows write posted.json/CAPTIONS.md, and running under separate groups
  # let them execute concurrently, which lost a full batch of Kaggle-generated
  # images to a rebase-conflict-then-silent-push-failure on a live run (see the
  # "Persist state" step in both workflows). Queuing image and video runs
  # against each other instead of racing is a real fix for that; the retry
  # loop in "Persist state" is the second layer, for any other concurrent
  # writer (the picker's own Contents-API writes, a manual push).
  group: autopilot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # A ZeroGPU run is ~1-2min of actual generation and the Space ladder can try three
    # of them, each against every token. 30min is a stall guard for a Space that
    # queues or hangs, not an expected duration.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        # gradio_client calls the HF Space directly (videogen.py). requests
        # handles TikTok + git; no torch/mediapipe needed for the video path --
        # the actual model inference happens on HF's ZeroGPU, not here. (Ollama
        # IS installed below, but only as llm.py's fallback text backend for the
        # caption, not for any image/video model.)
        run: pip install gradio_client requests

      - name: Install Ollama and pull the caption model
        # Fallback backend for llm.py (caption_writer/motion_writer) only -- HF's
        # router is tried first and normally answers, so this is the safety net for
        # when it doesn't. Without it this workflow had NO text model at all, which is
        # why every video draft shipped niches.json's fixed hashtag string. Fresh
        # install + pull every run; GH runners have no persistent cache.
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 1
          done
          ollama pull llama3.2:3b

      - name: Install ffmpeg
        # videogen.py shells out to ffmpeg to normalize frame rate before TikTok
        # publish (TikTok rejected a real draft with frame_rate_check_failed on
        # motionforge's raw output) -- confirmed NOT preinstalled on this runner
        # despite it being on GitHub's documented ubuntu-latest software list.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run autopilot (video niche only)
        env:
          NICHES: aibeautyvideo
          # autopilot.py._run_video_niche reads these overrides -- push_video.py's
          # local UI is what put them here via workflow_dispatch inputs.
          VIDEO_IMAGE_URL: ${{ inputs.image_url }}
          VIDEO_PROMPT: ${{ inputs.motion_prompt }}
          VIDEO_LENGTH_S: ${{ inputs.length_s }}
          VIDEO_STEPS: ${{ inputs.steps }}
          VIDEO_RETRY_URL: ${{ inputs.retry_video_url }}
          # Two jobs here: attributes the ZeroGPU video call to your account
          # (videogen.py) and authenticates llm.py's HF-router captions. The
          # router needs a fine-grained token with "Make calls to Inference
          # Providers"; a ZeroGPU-only read token 401s there and llm.py falls
          # through to the Ollama install above.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Optional, comma-separated HF_TOKENS secret (multiple accounts) takes
          # priority over the single HF_TOKEN above in videogen.py -- rotates to
          # the next token if one hits its account's free ZeroGPU quota
          # (5min/day each), and llm.py rotates over the same list for router
          # credits. Only add this secret if you actually have more than one HF
          # account's token; leaving it unset falls back to the single HF_TOKEN.
          HF_TOKENS: ${{ secrets.HF_TOKENS }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN_AIBEAUTY: ${{ secrets.TIKTOK_REFRESH_TOKEN_AIBEAUTY }}
          # Review surface: every generated image is posted to the Telegram channel
          # with Make video / Skip buttons (telegram.py). Unset = not posted, which is
          # a supported setup and never fails a run -- the TikTok draft is queued
          # before this and does not depend on it. The button PRESSES are handled by
          # the Cloudflare Worker in worker/, not here; see worker/README.md.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Must be passed explicitly, not just exist as a secret. telegram.video_chat_id()
          # falls back to TELEGRAM_CHAT_ID when this is unset -- which is correct for a
          # deliberate single-channel setup, and is exactly why forgetting it here failed
          # silently: a generated video landed in the photos channel with no error.
          TELEGRAM_VIDEO_CHAT_ID: ${{ secrets.TELEGRAM_VIDEO_CHAT_ID }}
          PAGES_BASE_URL: https://gesimuse.github.io/mpt
        run: python autopilot.py

      # See autopilot.yml's own "Persist state" step for why this retries and
      # fails loudly instead of a one-shot swallow -- this workflow and that one
      # both write posted.json/CAPTIONS.md and used to run in separate
      # concurrency groups, which lost a full batch of images to a silent
      # rebase-conflict swallow on a live run.
      - name: Persist state (keepalive)
        if: always()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@github.com"
          if git diff --quiet -- posted.json CAPTIONS.md; then
            echo "nothing to persist"
            exit 0
          fi
          # Keep THIS run's state outside the repo, so a reset can't take it with it.
          cp posted.json "$RUNNER_TEMP/ours.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin ${{ github.ref_name }}
            # Rebuild on top of the remote rather than rebasing onto it. posted.json's
            # uploads array is appended to by BOTH workflows and by picker.html's
            # Contents-API writes, and two appends in the same place are a textual
            # conflict git cannot resolve -- the old loop ran `git pull --rebase`, hit
            # CONFLICT (content) in posted.json, aborted, and retried the identical
            # rebase four more times for four identical conflicts. Run 33318817540
            # generated images, pushed a real TikTok draft, then lost its own state
            # that way; 5c3bef4 is an earlier occurrence recovered by hand from CI
            # logs. scripts/merge_state.py merges by VALUE, so there is nothing left
            # to conflict.
            git reset --hard origin/${{ github.ref_name }}
            python3 scripts/merge_state.py "$RUNNER_TEMP/ours.json" posted.json posted.json
            python3 -c "import autopilot, json; autopilot.write_pending_captions(json.load(open('posted.json')))"
            git add posted.json CAPTIONS.md
            if git diff --cached --quiet; then
              echo "remote already has everything from this run"
              exit 0
            fi
            git commit -m "chore: autopilot-video run $(date -u +%F_%H:%M)"
            if git push; then
              echo "persisted on attempt $attempt"
              exit 0
            fi
            echo "push rejected (remote moved again), retrying..."
            sleep $((attempt * 5))
          done
          echo "::error::failed to persist posted.json/CAPTIONS.md after 5 attempts -- state from this run was NOT saved to main"
          exit 1
