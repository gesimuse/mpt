name: Deploy picker.html to gh-pages
on:
  push:
    branches: [main]
    paths:
      - picker.html
      - .github/workflows/deploy_picker.yml
  workflow_dispatch:

concurrency:
  # gh-pages branch already gets writes from the photo cron (tiktok.py hosting
  # images). Serialize this deploy with them so we never race the git push.
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy picker.html to gh-pages
        # Uses git worktree so we can commit to gh-pages without cloning again.
        # If gh-pages doesn't exist yet, create an orphan branch on the fly.
        run: |
          git config user.name "autopilot-bot"
          git config user.email "actions@github.com"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add ../gh-pages gh-pages
          else
            git worktree add --detach ../gh-pages
            cd ../gh-pages
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd -
          fi
          cp picker.html ../gh-pages/picker.html
          cd ../gh-pages
          git add picker.html
          git diff --cached --quiet || git commit -m "deploy picker.html"
          git push origin gh-pages
