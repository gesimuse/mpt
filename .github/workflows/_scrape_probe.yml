name: TEMP scrape probe
# Throwaway. Answers one question: does the Google Maps scraper work from a GitHub
# Actions runner, or does Google block the datacenter IP? Delete once answered.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start the scraper
        run: |
          docker run -d --name gmaps -p 127.0.0.1:8080:8080 \
            gosom/google-maps-scraper:v1.17.4 -web -data-folder /gmapsdata
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/v1/jobs >/dev/null && break
            sleep 2
          done
          echo "scraper up"

      - name: One small job (Braila, construction)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          BASE="http://localhost:8080"
          def req(method, path, body=None):
              data=json.dumps(body).encode() if body else None
              r=urllib.request.Request(BASE+path, data=data, method=method,
                                       headers={"Content-Type":"application/json"})
              with urllib.request.urlopen(r, timeout=60) as resp:
                  raw=resp.read().decode()
                  return json.loads(raw) if raw.strip() else {}
          job={"name":"probe","keywords":["firma constructii Braila"],
               "lang":"ro","zoom":13,"lat":"45.2692","lon":"27.9575",
               "depth":3,"max_time":420,"email":True}
          created=req("POST","/api/v1/jobs",job)
          jid=(created.get("data") or created).get("id")
          print("job:", jid, flush=True)
          for i in range(60):
              time.sleep(10)
              st=req("GET",f"/api/v1/jobs/{jid}")
              status=(st.get("data") or st).get("status")
              print(f"  {i*10:4}s {status}", flush=True)
              if status in ("ok","failed"): break
          import urllib.error
          try:
              with urllib.request.urlopen(f"{BASE}/api/v1/jobs/{jid}/download", timeout=120) as r:
                  csv_text=r.read().decode(errors="replace")
              rows=[l for l in csv_text.splitlines() if l.strip()]
              print(f"\nRESULT rows (incl header): {len(rows)}")
              for l in rows[:4]: print("  ", l[:150])
          except Exception as e:
              print("download failed:", type(e).__name__, str(e)[:200])
          PY

      - name: Scraper logs
        if: always()
        run: docker logs gmaps 2>&1 | tail -30
